# Replay Verdict Schema (v1)
#
# 定義 `cap replay verify <run_id>` / `engine/replay_verifier.py:verify_run`
# 產出的 verdict envelope。Pure-function comparison: 給定 stored baseline
# (run dir 內的 agent-sessions.json envelope agent_skills_baseline)
# 與 current baseline (engine/agent_skills_snapshot.py:compute_snapshot
# 結果)，產出 5-state verdict + drift detail。
#
# Spec SSOT: docs/cap/REPLAY-CONTRACT-DESIGN.md §2 (verdict enum) §3 (drift
# scope) §7 (schema skeleton).
#
# v1 範圍鎖定：H1 verifier 只判 builtin agent-skills/ drift；project layer
# `.cap/skills.yaml` drift 留 H2/H3。schema 預留 drift_details.project_skill_diff
# 為 nullable forward contract，H1 producer 永遠寫 null，H2 才會填值。
#
# JSON-Schema 風格；可被 step_runtime.py validate-jsonschema 驗證。

schema_version: 1
title: CAP Replay Verdict Schema
description: Output of `cap replay verify <run_id>`; pure-function comparison of stored agent_skills_baseline (from agent-sessions.json envelope) against current builtin baseline. Drift scope in v1 is limited to builtin agent-skills/; project / shared layer skill drift and workflow YAML drift are deferred to H2 / H3.

required:
  - schema_version
  - run_id
  - verified_at
  - verdict
  - baseline_observed
  - baseline_current
  - drift_details

properties:
  schema_version:
    type: integer
    enum: [1]
    description: Schema version for the replay-verdict envelope. Bump on breaking changes.

  run_id:
    type: string
    description: |
      The run id whose stored baseline was compared. Matches the run
      directory name under <cap_home>/projects/<project_id>/reports/
      workflows/<workflow_id>/<run_id>/.

  verified_at:
    type: string
    description: ISO-8601 UTC timestamp the verdict was computed (e.g., 2026-05-07T12:34:56Z).

  verdict:
    type: string
    enum:
      - replayable
      - drifted_compatible
      - drifted_incompatible
      - unverifiable
      - not_found
    description: |
      Aggregate verdict (design memo §2):
        replayable             — stored baseline equals current baseline (dir_hash match + every prompt_files entry aligned).
        drifted_compatible     — dir_hash differs, but every prompt_file the run actually used (prompt_files_used) still matches; replay still reproduces original behaviour.
        drifted_incompatible   — at least one prompt_files_used entry has changed or was removed in current baseline; replay would not reproduce original behaviour.
        unverifiable           — stored envelope lacks agent_skills_baseline (pre-A0 #4 run) or anchors are entirely null; verifier does not guess.
        not_found              — run_id directory or agent-sessions.json missing; nothing to verify.

  reason:
    type: string
    description: |
      Optional human-readable single-line explanation of the verdict.
      Producer SHOULD populate this for non-replayable verdicts so users
      see actionable detail without parsing drift_details.

  baseline_observed:
    type: [object, "null"]
    description: |
      Compact baseline summary read from agent-sessions.json envelope's
      agent_skills_baseline field at run-time of the original run.
      Null when the envelope had no baseline (verdict=unverifiable);
      verifier does not invent values.
    properties:
      cap_version:
        type: [string, "null"]
        description: cap_version recorded at the original run.
      git_commit:
        type: [string, "null"]
        description: HEAD SHA of cap-protocols at the original run.
      git_dirty:
        type: boolean
        description: Working-tree dirty flag at the original run.
      dir_hash:
        type: string
        description: sha256:<hex> aggregate of all *.md files at the original run.
      file_count:
        type: integer
        description: Count of *.md files hashed at the original run.

  baseline_current:
    type: [object, "null"]
    description: |
      Compact summary of the current builtin baseline at verification
      time. Null only when verdict=not_found (never computed because
      the run dir was missing); otherwise always populated even when
      verdict=unverifiable so callers can still see the current state.
    properties:
      cap_version:
        type: [string, "null"]
      git_commit:
        type: [string, "null"]
      git_dirty:
        type: boolean
      dir_hash:
        type: string
      file_count:
        type: integer

  drift_details:
    type: object
    description: |
      Per-axis drift breakdown. Always populated when verdict != not_found.
      For verdict=unverifiable, prompt_files_* arrays are empty and
      *_match flags are false; producer still emits the object so
      consumers can rely on its structural presence.
    required:
      - prompt_files_used
      - prompt_files_changed
      - prompt_files_removed
      - dir_hash_match
      - cap_version_match
      - git_commit_match
      - project_skill_diff
    properties:
      prompt_files_used:
        type: array
        description: |
          Distinct set of prompt_file paths the run actually used,
          extracted from agent-sessions.json sessions[].prompt_file
          (null entries — typically shell-only steps — are filtered out).
          Paths are normalised relative to agent-skills/ so they match
          baseline.prompt_files dictionary keys.
        items:
          type: string
      prompt_files_changed:
        type: array
        description: |
          Subset of prompt_files_used whose per-file hash differs
          between baseline_observed and baseline_current. Drives the
          drifted_incompatible verdict together with prompt_files_removed.
        items:
          type: string
      prompt_files_removed:
        type: array
        description: |
          Subset of prompt_files_used absent from current baseline's
          prompt_files dictionary (the file was deleted between the
          original run and verification). Together with prompt_files_changed,
          a non-empty list forces verdict=drifted_incompatible.
        items:
          type: string
      dir_hash_match:
        type: boolean
        description: Whether baseline_observed.dir_hash equals baseline_current.dir_hash.
      cap_version_match:
        type: boolean
        description: |
          Whether cap_version strings match between observed and current.
          Soft signal only; mismatch alone does NOT downgrade verdict
          (avoid release-tag noise).
      git_commit_match:
        type: boolean
        description: |
          Whether git_commit strings match between observed and current.
          Soft signal only; mismatch alone does NOT downgrade verdict.
      workflow_yaml_diff:
        type: [object, "null"]
        description: |
          H3 #3 widening — workflow YAML axis drift detail. Whole-file
          hash only (Cost-Aware minimal scope per
          docs/cap/H3-DRIFT-EXPANSION-DESIGN.md §5.1); per-step
          precision deferred to H4+. Behaviour:

          * ``null`` (legacy / pre-H3 envelopes): the run lacks
            workflow_yaml_baseline. Treated as
            ``axis_verdict=unverifiable_axis`` for aggregation.
          * **object body** (H3 attach landed): structured axis
            verdict. ``axis_verdict`` may be ``replayable``
            (content_hash match), ``drifted_compatible`` (hash
            differs / file missing — caller must self-inspect),
            or ``unverifiable_axis`` (rare; workflow_path missing
            from baseline). Drifted_incompatible is NEVER emitted
            for this axis (whole-file hash precision limit).
        properties:
          was_recorded:
            type: boolean
          axis_verdict:
            type: string
            enum: [replayable, drifted_compatible, drifted_incompatible, unverifiable_axis]
          workflow_id:
            type: [string, "null"]
          workflow_path:
            type: [string, "null"]
          source_layer:
            type: [string, "null"]
          workflow_present_observed:
            type: [boolean, "null"]
          workflow_present_current:
            type: boolean
          content_hash_observed:
            type: [string, "null"]
          content_hash_current:
            type: [string, "null"]
          reason:
            type: [string, "null"]

      constitution_diff:
        type: [object, "null"]
        description: |
          H3 #3 widening — constitution drift detail. Whole-file hash
          only (per-block hash deferred to H4+ per design memo §5.2).
          Same axis_verdict behaviour as workflow_yaml_diff:
          drifted_incompatible is never emitted for this axis.

          Note: constitution_present_observed/_current distinguishes
          "no constitution file at run time" (bootstrap pre-creation)
          from "constitution removed between run and verify".
        properties:
          was_recorded:
            type: boolean
          axis_verdict:
            type: string
            enum: [replayable, drifted_compatible, drifted_incompatible, unverifiable_axis]
          constitution_path:
            type: [string, "null"]
          constitution_present_observed:
            type: [boolean, "null"]
          constitution_present_current:
            type: boolean
          content_hash_observed:
            type: [string, "null"]
          content_hash_current:
            type: [string, "null"]
          reason:
            type: [string, "null"]

      capability_schema_diff:
        type: [object, "null"]
        description: |
          H3 #3 widening — capability schema drift detail. Whole-file
          hash only (per-capability hash deferred to H4+ per design
          memo §5.3). Same axis_verdict behaviour as
          workflow_yaml_diff and constitution_diff.

          Drift on this axis surfaces "schemas/capabilities.yaml has
          changed since the run"; caller must read the schema diff
          to know whether their workflow is affected.
        properties:
          was_recorded:
            type: boolean
          axis_verdict:
            type: string
            enum: [replayable, drifted_compatible, drifted_incompatible, unverifiable_axis]
          schema_path:
            type: [string, "null"]
          schema_present_observed:
            type: [boolean, "null"]
          schema_present_current:
            type: boolean
          content_hash_observed:
            type: [string, "null"]
          content_hash_current:
            type: [string, "null"]
          reason:
            type: [string, "null"]

      project_skill_diff:
        type: [object, "null"]
        description: |
          Project layer skill drift detail. Two shapes per
          ``docs/cap/H2-PROJECT-SKILL-DRIFT-DESIGN.md`` §5:

          * ``null`` (legacy / pre-A0 #4 runs): the run has no
            ``agent_skills_baseline`` either, so verifier cannot
            establish either axis. Treated as "H1 contract not yet
            applicable" — distinct from a populated body with
            ``axis_verdict=unverifiable_axis``.
          * **object body** (H2 widening, schema_version still 1):
            structured per-axis drift. Always populated when
            ``baseline_observed`` is non-null. Fields:

            ``was_recorded``: bool — true when envelope had a
            ``project_skill_baseline`` recorded at run-time AND a
            ``binding_summary`` was attached, allowing precise
            skills_used selection. False for envelopes that lack
            either piece (verifier emits a neutral, observation-only
            body — see ``axis_verdict=unverifiable_axis``).

            ``axis_verdict``: enum (``replayable`` / ``drifted_compatible``
            / ``drifted_incompatible`` / ``unverifiable_axis``).
            ``unverifiable_axis`` does NOT downgrade the top-level
            verdict to ``unverifiable``; the worst-axis aggregator
            falls back to the other axis instead. Top-level
            ``unverifiable`` only fires when every axis is
            ``unverifiable_axis``.

            ``project_dir_present_observed`` / ``project_dir_present_current``:
            bool / null — whether ``<project_root>/.cap/`` existed
            at original run-time vs verification time. Distinguishes
            "no project layer ever" from "project layer was deleted".

            ``dir_hash_observed`` / ``dir_hash_current``: aggregate
            hashes from project_skills_snapshot. Both null when
            project_dir_present is false on the corresponding side.

            ``skills_used``: array of skill_ids the run actually used
            from project layer (derived from
            ``binding_summary.steps[*].selected_skill_id`` filtered
            by ``skill_source.source_layer == "project"``). Empty
            when binding_summary missing.

            ``skills_changed``: subset of skills_used whose per-skill
            hash differs between observed and current snapshots.
            Drives ``axis_verdict=drifted_incompatible`` together
            with ``skills_removed`` / ``skills_added_masked``.

            ``skills_removed``: subset of skills_used absent from
            current snapshot (project skill was deleted).

            ``skills_added_masked``: subset of skills_used that
            exist in current but are now masked
            (``disabled: true`` or replaces-target locked) so
            cannot be selected. Treated as drifted_incompatible.

            ``reason``: optional human-readable note (single line).
        properties:
          was_recorded:
            type: boolean
            description: True when envelope carried both project_skill_baseline AND binding_summary; false otherwise (axis goes neutral).
          axis_verdict:
            type: string
            enum: [replayable, drifted_compatible, drifted_incompatible, unverifiable_axis]
            description: Per-axis verdict. unverifiable_axis is neutral for top-level aggregation.
          project_dir_present_observed:
            type: [boolean, "null"]
            description: Whether <project_root>/.cap/ existed at original run-time. Null when was_recorded=false.
          project_dir_present_current:
            type: boolean
            description: Whether <project_root>/.cap/ exists at verification time.
          dir_hash_observed:
            type: [string, "null"]
            description: Aggregate sha256:<hex> from observed project skills snapshot. Null when project_dir_present_observed is false or was_recorded=false.
          dir_hash_current:
            type: [string, "null"]
            description: Aggregate sha256:<hex> from current project skills snapshot. Null when project_dir_present_current is false.
          skills_used:
            type: array
            items: {type: string}
            description: Distinct project layer skill_ids the run actually used.
          skills_changed:
            type: array
            items: {type: string}
            description: Subset of skills_used whose per-skill canonical-JSON hash differs.
          skills_removed:
            type: array
            items: {type: string}
            description: Subset of skills_used absent from current snapshot.
          skills_added_masked:
            type: array
            items: {type: string}
            description: Subset of skills_used masked in current registry (disabled / replaces target).
          reason:
            type: [string, "null"]
            description: Optional human-readable single-line explanation.
