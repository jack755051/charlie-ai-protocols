# Skill Registry Schema (v2)
#
# 定義目前 runtime 可用的 agent-skill 清單。
# v2: 合併原 skill-manifest.schema.yaml 的欄位，不再需要獨立 manifest 檔。

schema_version: 2

fields:
  default_provider:
    type: string
    required: false

  binding_defaults:
    type: object
    required: false
    fields:
      binding_mode:
        type: string
        enum: [strict, preferred, fallback_allowed]
      missing_policy:
        type: string
        enum: [halt, substitute, manual]

  skills:
    type: object[]
    required: true
    item_fields:

      # ── 識別與版本 ──
      skill_id:
        type: string
        required: true
        description: skill 的穩定識別碼
      skill_version:
        type: string
        required: false
        description: skill 本身的版本
      kind:
        type: string
        required: false
        enum: [role, skill]
        description: |
          Discriminator for registry entry type. Phase 1 schema-only
          field — the runtime does NOT yet branch on kind. Future
          runtime work will switch on this enum instead of inferring
          entry type from agent_alias presence.

            role  — an executable agent role that consumes capabilities
                    and drives workflow steps (e.g. supervisor / techlead /
                    frontend / backend / qa). Pairs with agent_alias +
                    prompt_file + cli to satisfy
                    RuntimeBinder._has_execution_metadata.
            skill — a mountable guardrail / strategy / advisory layer
                    that augments a role rather than driving steps
                    itself (e.g. shared-karpathy-guidelines, framework-
                    specific TDD strategies). May or may not carry
                    execution metadata; today it does because the
                    runtime selection path expects it, but Phase 2+
                    may relax that requirement.

          Backwards-compatible legacy inference (when ``kind`` is
          missing from a registry entry):
            agent_alias present → kind = role  (legacy executable role)
            agent_alias absent  → kind = skill (legacy mountable strategy)

          Real entries today (v0.24.7): all builtin agent-skills are
          implicit kind=role; the shared-karpathy-guidelines entry in
          ~/.cap/shared/skills.yaml is implicit kind=skill (advisory
          guardrail). Either can opt into explicit ``kind`` without
          changing runtime behaviour — the field is informative now,
          dispatcher-relevant later.
      agent_alias:
        type: string
      provider:
        type: string
        description: "builtin / local / marketplace / langgraph"

      # ── 執行入口 ──
      prompt_file:
        type: string
      cli:
        type: string
      runtime:
        type: string
        required: false
        description: 非 CLI 執行時的 runtime 類型

      # ── 啟用與優先序 ──
      enabled:
        type: boolean
      priority:
        type: integer

      # ── Override 契約（v0.22.0+ A0 #2） ──
      # 詳細語意 SSOT：policies/agent-skills-baseline.md §4
      disabled:
        type: boolean
        required: false
        description: |
          Tombstone mask. When set to true on a higher-priority layer
          (project / shared) entry that shares its skill_id with a
          lower-layer entry, the skill_id is hidden from
          _find_candidates / _find_fallback selection. Lower-layer
          entries with the same skill_id cannot be picked either —
          the mask wins. Diagnostics / binding report still surface
          the masked entry so audit can trace the decision.
          Mutually exclusive with `replaces` on the same entry; if
          both are set, `disabled` wins (entry is masked, no
          replacement applies).
      replaces:
        type: string
        required: false
        description: |
          Replacement target skill_id. When set, the runtime treats
          the named target skill as masked (mask_reason="replaced_by=<self>")
          so it cannot be picked as a candidate. The replacement
          skill itself is selected normally. If the replacement omits
          `provided_capabilities` (missing key or empty list), it
          inherits the target's capabilities verbatim; if the
          replacement specifies its own `provided_capabilities`, no
          inheritance happens (replacement wins). Multiple skills
          declaring `replaces` against the same target raise
          OverrideContractError.

      # ── Capability 綁定 ──
      compatible_workflow_versions:
        type: integer[]
      provided_capabilities:
        type: string[]
      fallback_roles:
        type: string[]

      # ── 選填 metadata ──
      metadata:
        type: object
        required: false
        fields:
          title:
            type: string
          description:
            type: string
          owner:
            type: string

# ── Examples ────────────────────────────────────────────────────────
#
# Example A: user-imported role registered in project layer
# (kind=role, new agent_alias, new capability — does not override builtin)
#
#   schema_version: 2
#   skills:
#     - skill_id: project-mobile-agent
#       kind: role
#       agent_alias: mobile
#       provider: project
#       enabled: true
#       priority: 100
#       prompt_file: agent-skills/mobile-agent.md
#       cli: claude
#       compatible_workflow_versions: [1, 2, 3]
#       provided_capabilities:
#         - mobile_implementation
#       fallback_roles:
#         - implementer
#
# Example B: user-imported role registered in shared layer
# (cross-project; constitution must explicitly allow shared root —
# see policies/agent-skills-baseline.md §3.5)
#
#   schema_version: 2
#   skills:
#     - skill_id: shared-mobile-agent
#       kind: role
#       agent_alias: mobile
#       provider: shared
#       enabled: true
#       priority: 90
#       prompt_file: ~/.cap/shared/prompts/mobile-agent.md
#       cli: claude
#       compatible_workflow_versions: [1, 2, 3]
#       provided_capabilities:
#         - mobile_implementation
#
# Example C: advisory skill registered in shared layer
# (kind=skill, mountable guardrail; today still requires execution
# metadata until Phase 5 attachment relaxes the requirement)
#
#   schema_version: 2
#   skills:
#     - skill_id: shared-karpathy-guidelines
#       kind: skill
#       agent_alias: karpathy-guidelines
#       provider: shared
#       enabled: true
#       priority: 80
#       prompt_file: agent-skills/strategies/karpathy-guidelines.md
#       cli: claude
#       compatible_workflow_versions: [1, 2, 3]
#       provided_capabilities:
#         - engineering_guardrails
#         - code_review_guardrails
